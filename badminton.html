<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽球點名板</title>
<style id="page-style">
  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --surface-2: #eceee9;
    --text: #1d2420;
    --muted: #66706a;
    --border: #dde1dc;
    --accent: #2e7d64;
    --accent-contrast: #ffffff;
    --leave: #c0692e;
    --leave-bg: #fbeee4;
    --danger: #b94a36;
    --danger-bg: #f7e6e2;
    --ok-bg: #e2f1ea;
    --sub: #2f6fb3;
    --sub-bg: #e3edf9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111513; --surface: #18201c; --surface-2: #202a25; --text: #e8eeea;
      --muted: #94a39b; --border: #2c3831; --accent: #4fc69d; --accent-contrast: #0b1512;
      --leave: #e39a63; --leave-bg: #35251a; --danger: #e1786a; --danger-bg: #3a211d; --ok-bg: #1b3329;
      --sub: #7fb0e8; --sub-bg: #1c2a3b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111513; --surface: #18201c; --surface-2: #202a25; --text: #e8eeea;
    --muted: #94a39b; --border: #2c3831; --accent: #4fc69d; --accent-contrast: #0b1512;
    --leave: #e39a63; --leave-bg: #35251a; --danger: #e1786a; --danger-bg: #3a211d; --ok-bg: #1b3329;
      --sub: #7fb0e8; --sub-bg: #1c2a3b;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px; line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-top: 14px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .between { justify-content: space-between; }

  .btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-weight: 600;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn.leave { background: var(--leave); border-color: var(--leave); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.35; cursor: default; }

  input[type="date"], input[type="text"], select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0;
  }

  /* 功能一：人數總覽 */
  .detail { margin-top: 4px; }
  .detail h3 { font-size: 14px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 5px 12px; font-size: 14px; border: 1px solid var(--border); background: var(--surface-2);
  }
  .chip.attend { background: var(--ok-bg); border-color: transparent; }
  .chip.sub { background: var(--sub-bg); border-color: transparent; }
  .chip.leave { background: var(--leave-bg); border-color: transparent; }
  .chip:has(.x) { padding-right: 2px; }
  .chip .x {
    border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1;
    width: 30px; height: 30px; margin: -6px 0; border-radius: 50%; display: grid; place-items: center; padding: 0;
  }
  .chip .x:hover, .chip .x:active { background: rgba(0, 0, 0, 0.08); color: var(--text); }
  .tag { font-size: 12px; color: var(--muted); }

  /* 功能三：可約的人（小卡片） */
  .chip.pool { padding-left: 0; gap: 0; }
  .chip.pool.yes { background: var(--sub-bg); border-color: transparent; }
  .chip.pool.no .name-btn { color: var(--muted); text-decoration: line-through; }
  .name-btn {
    border: 0; background: none; color: var(--text); font-weight: 600; font-size: 14px;
    padding: 5px 6px 5px 12px; margin: -5px 0; border-radius: 999px;
  }
  .chip.pool .tag { margin-right: 2px; }
  .chip.pool.yes .tag { color: var(--sub); font-weight: 600; }
  .chip.pool.no .tag { color: var(--danger); font-weight: 600; }

  /* 對話框 */
  dialog {
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
    padding: 20px; width: min(360px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }

  /* 行事曆 */
  .cal-head { text-align: center; }
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 12px; }

  /* 明細表：月份 × 打球日 */
  .sheet { width: 100%; border-collapse: collapse; margin-top: 14px; table-layout: fixed; }
  .sheet th, .sheet td { border: 1.5px solid var(--text-line, var(--muted)); text-align: center; padding: 0; }
  .sheet th { font-size: 14px; font-weight: 700; background: var(--surface-2); width: 44px; }
  .sheet td.empty { background: var(--surface); }
  .sheet .cell {
    width: 100%; min-height: 54px; border: 0; background: none; color: var(--text); padding: 4px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  .sheet .d { font-size: 17px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sheet .c { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
  .sheet .lv { font-size: 10px; color: var(--leave); }
  .sheet .sb { font-size: 10px; color: var(--sub); }
  .sheet .extra { display: flex; gap: 4px; justify-content: center; white-space: nowrap; }
  .sheet td.off { background: var(--danger-bg); }
  .sheet .hol { font-size: 10px; color: var(--danger); font-weight: 700; line-height: 1.2; }
  .holiday-note {
    display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    background: var(--leave-bg); color: var(--leave); font-size: 14px; font-weight: 600;
  }
  .holiday-note.show { display: block; }
  .sheet td.off .d, .sheet td.off .c { color: var(--danger); }
  .sheet td.past .d { opacity: 0.55; }
  .sheet td.sel { outline: 2px solid var(--accent); outline-offset: -3px; }
  .off-banner {
    display: none; margin-top: 12px; padding: 14px; border-radius: 12px; text-align: center;
    background: var(--danger-bg); color: var(--danger); font-weight: 700;
  }
  .is-off .off-banner { display: block; }
  .is-off .detail { display: none !important; }
  dialog h2 { margin-bottom: 12px; }
  dialog label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  dialog select, dialog input { width: 100%; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  details summary { cursor: pointer; font-weight: 600; }

  /* 共用儲存 */
  .save-status { min-height: 20px; margin: 2px 0 0; font-size: 13px; }
  .import-bar { border-color: var(--sub); background: var(--sub-bg); }
  .import-bar p { margin: 0 0 10px; }
  .saving .wrap { pointer-events: none; opacity: 0.6; }
  .read-only .chip .x, .read-only #addPersonForm, .read-only #addMemberForm,
  .read-only #offToggle, .read-only #importBar { display: none !important; }
  .read-only .name-btn { pointer-events: none; }
  .read-only .chip:has(.x) { padding-right: 12px; }
</style>
</head>
<body>
<template id="page-markup">
<div class="wrap">
  <h1>🏸 羽球點名板</h1>
  <p class="muted save-status" id="saveStatus" role="status"></p>

  <!-- 第一次使用：把這台裝置上的舊資料匯入共用版 -->
  <div class="card import-bar" id="importBar" hidden>
    <p id="importText"></p>
    <button class="btn primary small" id="importBtn">匯入</button>
    <button class="btn ghost small" id="importSkip">不用</button>
  </div>

  <!-- 本季行事曆 -->
  <div class="card" id="calCard">
    <div class="cal-head">
      <div class="cal-nav">
        <button class="btn small ghost" id="calPrev" aria-label="上一季">‹</button>
        <h2 id="calTitle" style="margin:0"></h2>
        <button class="btn small ghost" id="calNext" aria-label="下一季">›</button>
      </div>
    </div>
    <div id="calBody"></div>
    <div class="row" style="justify-content:flex-end; margin-top:12px">
      <button class="btn small" id="offToggle"></button>
    </div>
  </div>

  <!-- 功能一 + 功能二 -->
  <div class="card" id="statusCard">
    <div class="row between">
      <h2 id="statusDate"></h2>
    </div>
    <div class="detail" id="detail">
      <h3>出席</h3>
      <div class="chips" id="attendList"></div>
      <h3>請假</h3>
      <div class="chips" id="leaveList"></div>
      <h3>候補</h3>
      <div class="chips" id="subList"></div>
    </div>
    <div class="holiday-note" id="holidayNote"></div>
    <div class="off-banner">這天全員請假，不打球 🏖️</div>
  </div>

  <!-- 功能三 + 功能四 -->
  <div class="card" id="poolCard">
    <div class="row between">
      <h2>可以約的人</h2>
      <span class="muted">點名字加入候補</span>
    </div>
    <div class="chips" id="people" style="margin-top:12px"></div>
    <div class="row" id="addPersonForm" style="margin-top:12px">
      <input type="text" id="newPerson" placeholder="新增可約的人" style="flex:1">
      <button class="btn small" type="button" data-submit>新增</button>
    </div>
  </div>

  <!-- 固定成員設定 -->
  <div class="card" id="memberCard">
    <details>
      <summary>固定成員（預設都出席）</summary>
      <div class="chips" id="memberList" style="margin-top:12px"></div>
      <div class="row" id="addMemberForm" style="margin-top:12px">
        <input type="text" id="newMember" placeholder="新增成員" style="flex:1">
        <button class="btn small" type="button" data-submit>新增</button>
      </div>
    </details>
  </div>
</div>

<!-- 確認對話框（不用瀏覽器的 confirm，因為內嵌頁面常會被擋掉） -->
<dialog id="confirmDialog">
  <h2 id="confirmText"></h2>
  <div class="actions">
    <button class="btn ghost" id="confirmNo">取消</button>
    <button class="btn leave" id="confirmYes">確定刪除</button>
  </div>
</dialog>


<div class="toast" id="toast" role="status"></div>
</template>
<script id="board-data" type="application/json">{"initial":true,"members":[],"pool":[],"leaves":{},"invites":{},"offDays":[]}</script>
<script id="page-script">
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // 畫面結構放在 <template> 裡，儲存時才能原封不動地重新產生整頁
  var tpl = $('page-markup');
  tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl);

  // Google 試算表共用資料庫的網址（設定方式見 badminton-setup.md）；留空就不用
  var API_URL = 'https://script.google.com/macros/s/AKfycbxfIGxTZXI-uKX_WUwx5oWzSySmIvS3AoSPBZx-b1RnhSQyPXB9aRtToMEL41EA0qTbdw/exec';
  var OLD_STORAGE_KEY = 'badminton-board-v1'; // 改成共用前，資料存在各自的瀏覽器
  var WEEKLY_DAY = 3; // 固定每週三打球（0=日 … 6=六）
  var WEEKDAYS = '日一二三四五六';
  var START_DATE = '2026-10-01'; // 資料從 2026 第四季開始
  // 落在週三的國定假日（含補假），依人事行政總處規則推算；之後年份再往下加
  var HOLIDAYS = {
    '2027-02-10': '春節補假',
    '2027-06-09': '端午節',
    '2027-09-15': '中秋節',
    '2028-01-26': '春節',
    '2028-10-25': '光復節'
  };

  // 資料結構（存在頁面裡的 board-data）：
  // members: 固定成員（預設出席）
  // pool: 可以約的人
  // leaves: { "2026-10-07": ["小明"] }
  // invites: { "2026-10-07": { "阿華": "yes" } }
  // offDays: 全員請假日
  function normalize(d) {
    d = d || {};
    return {
      members: Array.isArray(d.members) ? d.members.slice() : [],
      pool: Array.isArray(d.pool) ? d.pool.slice() : [],
      leaves: d.leaves && typeof d.leaves === 'object' ? JSON.parse(JSON.stringify(d.leaves)) : {},
      invites: d.invites && typeof d.invites === 'object' ? JSON.parse(JSON.stringify(d.invites)) : {},
      offDays: Array.isArray(d.offDays) ? d.offDays.slice() : []
    };
  }
  var DATA = {};
  try { DATA = JSON.parse($('board-data').textContent) || {}; } catch (e) { DATA = {}; }
  var state = normalize(DATA);

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
  function today() { return fmt(new Date()); }
  function isOff(d) { return state.offDays.indexOf(d) !== -1; }
  function weekdayOf(d) { var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
  function leavesOn(d) { return state.leaves[d] || []; }
  function invitesOn(d) { return state.invites[d] || {}; }

  // 下一個固定球日（今天剛好是就用今天），跳過全員請假日
  function nextPlayDay() {
    var d = new Date();
    d.setDate(d.getDate() + (WEEKLY_DAY - d.getDay() + 7) % 7);
    var first = fmt(d);
    for (var i = 0; i < 60; i++) {
      var k = fmt(d);
      if (k >= START_DATE && !isOff(k)) return k;
      d.setDate(d.getDate() + 7);
    }
    return first;
  }
  // 儲存後頁面會重新載入，記住剛剛看的日期和捲動位置
  var date = nextPlayDay(), restoreScroll = 0;
  try {
    var kept = sessionStorage.getItem('bb-date');
    if (kept && /^\d{4}-\d{2}-\d{2}$/.test(kept) && kept >= START_DATE) date = kept;
    restoreScroll = +sessionStorage.getItem('bb-scroll') || 0;
    sessionStorage.removeItem('bb-scroll');
  } catch (e) { /* 忽略 */ }

  // ---- 儲存：大家共用同一份資料 ----
  // api：存到 Google 試算表，不用登入；shared：在 Claude 裡發布成新版本；
  // local：都沒有時（例如直接開檔案）存在這台瀏覽器
  var mode = 'pending', api = null, readOnly = false, pendingSave = false, saveTimer = null, retried = false;

  function setStatus(msg) { $('saveStatus').textContent = msg || ''; }
  function loadOld() {
    try { return JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)); } catch (e) { return null; }
  }
  function cleaned() {
    var out = normalize(state);
    Object.keys(out.leaves).forEach(function (k) { if (!out.leaves[k].length) delete out.leaves[k]; });
    Object.keys(out.invites).forEach(function (k) { if (!Object.keys(out.invites[k]).length) delete out.invites[k]; });
    return out;
  }
  function buildPage() {
    var data = cleaned();
    var json = JSON.stringify(data).replace(/</g, '\\u003c');
    var end = '</' + 'script>';
    return '<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>羽球點名板</title>\n' +
      '<style id="page-style">' + $('page-style').textContent + '</style>\n</head>\n<body>\n' +
      '<template id="page-markup">' + tpl.innerHTML + '</template>\n' +
      '<script id="board-data" type="application/json">' + json + end + '\n' +
      '<script id="page-script">' + $('page-script').textContent + end + '\n</body>\n</html>\n';
  }
  function save() {
    if (readOnly) return;
    if (mode === 'api') { apiSave(); return; }
    if (mode === 'local') {
      try { localStorage.setItem(OLD_STORAGE_KEY, JSON.stringify(cleaned())); } catch (e) { /* 忽略 */ }
    } else if (mode === 'shared') {
      setStatus('儲存中…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(publish, 1200); // 連續點幾下合併成一次儲存
    } else {
      pendingSave = true; // 共用功能還在連線，連上後再存
    }
  }
  function publish() {
    try {
      sessionStorage.setItem('bb-date', date);
      sessionStorage.setItem('bb-scroll', String(window.scrollY || 0));
    } catch (e) { /* 忽略 */ }
    document.body.classList.add('saving');
    api.publish(buildPage()).then(function () {
      setStatus('已儲存'); // 接著頁面會自動重新載入成最新版
    }, function (err) {
      document.body.classList.remove('saving');
      var code = err && err.code;
      if (code === 'conflict') {
        setStatus('別人剛更新了，正在載入最新版…');
      } else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) !== -1) {
        becomeReadOnly();
      } else if (code === 'rate_limited') {
        setStatus('儲存太頻繁，稍後自動再存一次…');
        saveTimer = setTimeout(publish, 5000);
      } else if (!retried && (code === 'upstream_error' || !code)) {
        retried = true;
        saveTimer = setTimeout(publish, 1000 + Math.random() * 1500);
      } else {
        setStatus('儲存失敗，請再試一次');
        retried = false;
      }
    });
  }
  function becomeReadOnly() {
    readOnly = true;
    document.body.classList.add('read-only');
    state = normalize(DATA); // 回到大家看到的版本
    render();
    setStatus('你目前只能檢視，需要編輯權限才能修改');
  }
  function showImportOffer() {
    var old = loadOld();
    if (!DATA.initial || !old || !((old.members || []).length || (old.pool || []).length)) return;
    $('importText').textContent = '這台裝置上有之前存的名單（固定成員 ' + (old.members || []).length +
      ' 位、可以約的人 ' + (old.pool || []).length + ' 位），要匯入給大家共用嗎？';
    $('importBar').hidden = false;
    $('importBtn').onclick = function () { $('importBar').hidden = true; state = normalize(old); render(); save(); };
    $('importSkip').onclick = function () { $('importBar').hidden = true; };
  }
  // ---- Google 試算表模式 ----
  // server：試算表上最後一次看到的資料；改完後把「和 server 的差別」逐項送出
  var server = null, dirty = false, inflight = false, apiTimer = null;
  function diffOps(a, b) {
    var ops = [];
    function list(type, x, y) {
      y.forEach(function (n) { if (x.indexOf(n) === -1) ops.push({ type: type, name: n, on: true }); });
      x.forEach(function (n) { if (y.indexOf(n) === -1) ops.push({ type: type, name: n, on: false }); });
    }
    list('member', a.members, b.members);
    list('pool', a.pool, b.pool);
    var dates = {};
    [a.leaves, b.leaves, a.invites, b.invites].forEach(function (o) { Object.keys(o).forEach(function (k) { dates[k] = 1; }); });
    Object.keys(dates).forEach(function (d) {
      var la = a.leaves[d] || [], lb = b.leaves[d] || [];
      lb.forEach(function (n) { if (la.indexOf(n) === -1) ops.push({ type: 'leave', date: d, name: n, on: true }); });
      la.forEach(function (n) { if (lb.indexOf(n) === -1) ops.push({ type: 'leave', date: d, name: n, on: false }); });
      var ia = a.invites[d] || {}, ib = b.invites[d] || {};
      Object.keys(ib).forEach(function (n) { if (ib[n] === 'yes' && ia[n] !== 'yes') ops.push({ type: 'sub', date: d, name: n, on: true }); });
      Object.keys(ia).forEach(function (n) { if (ia[n] === 'yes' && ib[n] !== 'yes') ops.push({ type: 'sub', date: d, name: n, on: false }); });
    });
    b.offDays.forEach(function (d) { if (a.offDays.indexOf(d) === -1) ops.push({ type: 'off', date: d, on: true }); });
    a.offDays.forEach(function (d) { if (b.offDays.indexOf(d) === -1) ops.push({ type: 'off', date: d, on: false }); });
    return ops;
  }
  // 畫面已經先改好了，儲存在背景進行；只有等太久才提示
  var slowTimer = null, doneTimer = null;
  function apiSave() {
    dirty = true;
    clearTimeout(doneTimer);
    if (!slowTimer) slowTimer = setTimeout(function () { setStatus('還在儲存，請稍等…'); }, 4000);
    clearTimeout(apiTimer);
    apiTimer = setTimeout(apiFlush, 400);
  }
  function apiSaved() {
    clearTimeout(slowTimer); slowTimer = null;
    setStatus('✓ 已儲存');
    clearTimeout(doneTimer);
    doneTimer = setTimeout(function () { setStatus(''); }, 2000);
  }
  // 還沒存完就要離開時提醒
  window.addEventListener('beforeunload', function (e) {
    if (mode === 'api' && (dirty || inflight)) { e.preventDefault(); e.returnValue = ''; }
  });
  function apiFlush() {
    if (inflight || !server) return;
    var ops = diffOps(server, state);
    dirty = false;
    if (!ops.length) { apiSaved(); return; }
    inflight = true;
    // text/plain 才不會被瀏覽器擋（Apps Script 不支援預檢請求）
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ ops: ops }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
      .then(readJson)
      .then(function (res) {
        inflight = false;
        if (!res.ok) throw new Error(res.error);
        server = normalize(res.state);
        if (dirty) { apiFlush(); return; }
        state = normalize(server); render();
        apiSaved();
      })
      .catch(function () {
        inflight = false; dirty = true;
        clearTimeout(slowTimer); slowTimer = null;
        setStatus('儲存失敗，稍後自動再試…');
        clearTimeout(apiTimer);
        apiTimer = setTimeout(apiFlush, 5000);
      });
  }
  function readJson(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text().then(function (t) {
      try { return JSON.parse(t); } catch (e) { throw new Error('回應不是資料：' + t.slice(0, 60)); }
    });
  }
  // 定時拿最新資料，看到別人的修改；第一次讀不到會自動重試兩次
  function apiLoad(first, tries) {
    if (inflight || dirty) return;
    fetch(API_URL, { cache: 'no-store' }).then(readJson).then(function (res) {
      if (!res.ok) throw new Error(res.error || '資料庫回報錯誤');
      if (inflight || dirty) return;
      server = normalize(res.state);
      state = normalize(server); render();
      if (first) setStatus('');
    }).catch(function (err) {
      if (!first) return;
      tries = tries || 0;
      if (tries < 2) { setStatus('讀取中…'); setTimeout(function () { apiLoad(true, tries + 1); }, 2000); return; }
      setStatus('連不上共用資料（' + ((err && err.message) || err) + '），請稍後重新整理');
    });
  }

  if (API_URL) {
    mode = 'api';
    setStatus('讀取中…');
    apiLoad(true);
    // 每 5 秒抓一次最新資料；網頁在背景時暫停
    setInterval(function () { if (!document.hidden) apiLoad(); }, 5000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) apiLoad(); });
  }
  var ready = API_URL ? Promise.resolve(false)
    : window.claude && window.claude.use ? window.claude.use('artifact') : Promise.resolve(null);
  Promise.resolve(ready).then(function (a) {
    if (a === false) return; // 用 Google 試算表
    if (a) { api = a; mode = 'shared'; showImportOffer(); }
    else {
      mode = 'local';
      var old = loadOld();
      if (old) { state = normalize(old); render(); }
    }
    if (pendingSave) { pendingSave = false; save(); }
  }, function () { mode = 'local'; });

  // ---- 畫面 ----
  function chip(text, cls, onRemove) {
    var el = document.createElement('span');
    el.className = 'chip ' + (cls || '');
    el.textContent = text;
    if (onRemove) {
      var x = document.createElement('button');
      x.className = 'x';
      x.type = 'button';
      x.setAttribute('aria-label', '移除 ' + text);
      x.textContent = '×';
      x.onclick = onRemove;
      el.appendChild(x);
    }
    return el;
  }

  function render() { renderMain(); renderCal(); }
  function renderMain() {
    var off = isOff(date);
    $('statusCard').classList.toggle('is-off', off);
    // 全員請假就不用約人，也不用看成員
    $('poolCard').hidden = off;
    $('memberCard').hidden = off;
    var p = date.split('-'), md = +p[1] + '/' + +p[2] + '（' + WEEKDAYS[weekdayOf(date)] + '）';
    $('statusDate').textContent = md;
    var hol = HOLIDAYS[date];
    $('holidayNote').textContent = hol ? '⚠️ 這天是國定假日（' + hol + '），' + (off ? '已設為全員請假' : '要不要設為全員請假？') : '';
    $('holidayNote').classList.toggle('show', !!hol);
    $('offToggle').textContent = off ? '取消全員請假' : '這天全員請假';

    var leaves = leavesOn(date);
    var invites = invitesOn(date);
    var attend = state.members.filter(function (m) { return leaves.indexOf(m) === -1; });
    var extras = Object.keys(invites).filter(function (n) { return invites[n] === 'yes'; });

    // 功能一：出席／請假／候補名單
    var al = $('attendList'); al.innerHTML = '';
    attend.forEach(function (n) {
      al.appendChild(chip(n, 'attend', function () {
        var list = state.leaves[date] = leavesOn(date);
        if (list.indexOf(n) === -1) list.push(n);
        save(); render();
        toast(n + ' 改為請假');
      }));
    });
    if (!al.children.length) al.innerHTML = '<span class="muted">沒有人</span>';

    var ll = $('leaveList'); ll.innerHTML = '';
    leaves.forEach(function (n) {
      ll.appendChild(chip(n, 'leave', function () {
        state.leaves[date] = leaves.filter(function (x) { return x !== n; });
        save(); render();
      }));
    });
    if (!ll.children.length) ll.innerHTML = '<span class="muted">沒有人請假</span>';

    var sl = $('subList'); sl.innerHTML = '';
    extras.forEach(function (n) {
      sl.appendChild(chip(n, 'sub', function () {
        delete invites[n]; save(); render();
        toast(n + ' 已從候補移除');
      }));
    });
    if (!sl.children.length) sl.innerHTML = '<span class="muted">沒有人</span>';

    // 功能三：可約的人（點名字加入／取消候補，× 刪除）
    var pl = $('people'); pl.innerHTML = '';
    state.pool.forEach(function (n) {
      var el = document.createElement('span');
      el.className = 'chip pool' + (invites[n] ? ' ' + invites[n] : '');
      var nameBtn = document.createElement('button');
      nameBtn.className = 'name-btn';
      nameBtn.textContent = n;
      nameBtn.onclick = function () { toggleSub(n); };
      el.appendChild(nameBtn);
      if (invites[n]) {
        var t = document.createElement('span');
        t.className = 'tag';
        t.textContent = invites[n] === 'yes' ? '已加入' : '已拒絕';
        el.appendChild(t);
      }
      var del = document.createElement('button');
      del.className = 'x';
      del.setAttribute('aria-label', '刪除 ' + n);
      del.textContent = '×';
      del.onclick = function () {
        askConfirm('要從名單移除「' + n + '」嗎？', function () {
          state.pool = state.pool.filter(function (x) { return x !== n; });
          save(); render();
        });
      };
      el.appendChild(del);
      pl.appendChild(el);
    });
    if (!state.pool.length) pl.innerHTML = '<span class="muted">還沒有人，下面新增吧</span>';

    // 固定成員
    var ml = $('memberList'); ml.innerHTML = '';
    state.members.forEach(function (n) {
      ml.appendChild(chip(n, '', function () {
        askConfirm('要移除成員「' + n + '」嗎？', function () {
          state.members = state.members.filter(function (x) { return x !== n; });
          save(); render();
        });
      }));
    });
    if (!state.members.length) ml.innerHTML = '<span class="muted">還沒有成員，下面新增吧</span>';
  }

  function toggleOff(d) {
    if (isOff(d)) state.offDays = state.offDays.filter(function (x) { return x !== d; });
    else state.offDays.push(d);
    save(); render();
  }
  $('offToggle').onclick = function () {
    toggleOff(date);
    toast(isOff(date) ? date + ' 設為全員請假' : date + ' 恢復打球');
  };
  // 不用 <form> 送出（內嵌頁面常會擋掉），改成按鈕點擊或按 Enter
  function onSubmit(id, fn) {
    var box = $(id);
    box.querySelector('[data-submit]').onclick = fn;
    box.querySelectorAll('input').forEach(function (inp) {
      // 中文輸入法選字時按 Enter／空白鍵不算送出
      var composing = false, composeEnd = 0;
      inp.addEventListener('compositionstart', function () { composing = true; });
      inp.addEventListener('compositionend', function () { composing = false; composeEnd = Date.now(); });
      inp.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        if (composing || e.isComposing || e.keyCode === 229 || Date.now() - composeEnd < 100) return;
        e.preventDefault(); fn();
      });
    });
  }

  function setDate(d) {
    date = d;
    focusCal();
    render();
  }

  function subCount(d) {
    var inv = invitesOn(d);
    return Object.keys(inv).filter(function (n) { return inv[n] === 'yes'; }).length;
  }
  function attendCount(d) {
    var leaves = leavesOn(d);
    return state.members.filter(function (m) { return leaves.indexOf(m) === -1; }).length + subCount(d);
  }
  function isPlayDay(d) {
    return !isOff(d) && d >= START_DATE && weekdayOf(d) === WEEKLY_DAY;
  }

  // 行事曆：季度照月份分（1–3、4–6、7–9、10–12 月）
  var calYear, calQ;
  function focusCal() {
    var p = date.split('-');
    calYear = +p[0]; calQ = Math.floor((+p[1] - 1) / 3);
  }
  function renderCal() {
    var start = fmt(new Date(calYear, calQ * 3, 1)), end = fmt(new Date(calYear, calQ * 3 + 3, 0));
    $('calTitle').textContent = calYear + ' 第' + '一二三四'[calQ] + '季';
    $('calPrev').disabled = start <= START_DATE;
    $('calBody').innerHTML = '';
    renderSheet(calYear, calQ * 3);
  }

  // 明細表：每列一個月，列出這個月的打球日與出席人數
  function renderSheet(y, m0) {
    var rows = [], maxCols = 0, t = today();
    for (var m = m0; m < m0 + 3; m++) {
      var days = new Date(y, m + 1, 0).getDate(), list = [];
      for (var d = 1; d <= days; d++) {
        var key = y + '-' + pad(m + 1) + '-' + pad(d);
        if (isOff(key) && weekdayOf(key) === WEEKLY_DAY) list.push({ key: key, d: d, off: true });
        else if (isPlayDay(key)) {
          list.push({ key: key, d: d, n: attendCount(key), l: leavesOn(key).length, sb: subCount(key) });
        }
      }
      rows.push({ m: m, list: list });
      maxCols = Math.max(maxCols, list.length);
    }
    var table = document.createElement('table'); table.className = 'sheet';
    var tb = document.createElement('tbody');
    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      var th = document.createElement('th'); th.scope = 'row';
      th.textContent = (row.m + 1) + '月';
      tr.appendChild(th);
      for (var i = 0; i < Math.max(maxCols, 1); i++) {
        var td = document.createElement('td'), c = row.list[i];
        if (!c) { td.className = 'empty'; tr.appendChild(td); continue; }
        if (c.off) td.classList.add('off');
        var hol = HOLIDAYS[c.key];
        if (c.key < t) td.classList.add('past');
        if (c.key === date) td.classList.add('sel');
        var b = document.createElement('button'); b.className = 'cell';
        b.innerHTML = '<span class="d">' + c.d + '</span>' + (c.off
          ? '<span class="c">停</span>'
          : '<span class="c">' + c.n + '人</span>' + (c.l || c.sb ? '<span class="extra">' + (c.l ? '<span class="lv">假' + c.l + '</span>' : '') + (c.sb ? '<span class="sb">補' + c.sb + '</span>' : '') + '</span>' : ''))
          + (hol ? '<span class="hol">' + hol + '</span>' : '');
        b.setAttribute('aria-label', (row.m + 1) + '月' + c.d + '日，' + (hol ? hol + '，' : '') + (c.off ? '全員請假' : '出席 ' + c.n + ' 人' + (c.l ? '，請假 ' + c.l + ' 人' : '') + (c.sb ? '，候補 ' + c.sb + ' 人' : '')));
        b.onclick = (function (k) { return function () { setDate(k); }; })(c.key);
        td.appendChild(b); tr.appendChild(td);
      }
      tb.appendChild(tr);
    });
    table.appendChild(tb); $('calBody').appendChild(table);
  }

  function shiftQ(step) {
    if (step < 0 && $('calPrev').disabled) return;
    calQ += step;
    if (calQ < 0) { calQ = 3; calYear--; }
    if (calQ > 3) { calQ = 0; calYear++; }
    renderCal();
  }
  $('calPrev').onclick = function () { shiftQ(-1); };
  $('calNext').onclick = function () { shiftQ(1); };
  // 點對話框外面的灰色區域也能關閉
  document.querySelectorAll('dialog').forEach(function (dlg) {
    dlg.addEventListener('click', function (e) {
      if (e.target !== dlg) return;
      var r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
    });
  });

  var onConfirm = null;
  function askConfirm(msg, cb) {
    onConfirm = cb;
    $('confirmText').textContent = msg;
    $('confirmDialog').showModal();
  }
  $('confirmYes').onclick = function () {
    $('confirmDialog').close();
    if (onConfirm) onConfirm();
    onConfirm = null;
  };
  $('confirmNo').onclick = function () { onConfirm = null; $('confirmDialog').close(); };

  // 功能三：點名字直接加入候補，再點一次取消
  function toggleSub(n) {
    var inv = state.invites[date] = invitesOn(date);
    if (inv[n] === 'yes') { delete inv[n]; toast(n + ' 已從候補移除'); }
    else { inv[n] = 'yes'; toast(n + ' 加入候補'); }
    save(); render();
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // 新增名字
  function addName(inputId, listKey) {
    return function () {
      var v = $(inputId).value.trim();
      if (v && state[listKey].indexOf(v) === -1) { state[listKey].push(v); save(); render(); }
      $(inputId).value = '';
    };
  }
  onSubmit('addPersonForm', addName('newPerson', 'pool'));
  onSubmit('addMemberForm', addName('newMember', 'members'));

  setDate(date);
  if (restoreScroll) window.scrollTo(0, restoreScroll);
})();
</script>
</body>
