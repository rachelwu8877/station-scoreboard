<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽球點名板</title>
<style>
  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --surface-2: #eceee9;
    --text: #1d2420;
    --muted: #66706a;
    --border: #dde1dc;
    --accent: #2e7d64;
    --accent-contrast: #ffffff;
    --leave: #c0692e;
    --leave-bg: #fbeee4;
    --danger: #b94a36;
    --danger-bg: #f7e6e2;
    --ok-bg: #e2f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111513; --surface: #18201c; --surface-2: #202a25; --text: #e8eeea;
      --muted: #94a39b; --border: #2c3831; --accent: #4fc69d; --accent-contrast: #0b1512;
      --leave: #e39a63; --leave-bg: #35251a; --danger: #e1786a; --danger-bg: #3a211d; --ok-bg: #1b3329;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111513; --surface: #18201c; --surface-2: #202a25; --text: #e8eeea;
    --muted: #94a39b; --border: #2c3831; --accent: #4fc69d; --accent-contrast: #0b1512;
    --leave: #e39a63; --leave-bg: #35251a; --danger: #e1786a; --danger-bg: #3a211d; --ok-bg: #1b3329;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px; line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-top: 14px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .between { justify-content: space-between; }

  .btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-weight: 600;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn.leave { background: var(--leave); border-color: var(--leave); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.35; cursor: default; }

  input[type="date"], input[type="text"], select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0;
  }

  /* 功能一：人數總覽 */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .stat {
    border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: left;
    background: var(--surface-2); color: var(--text);
  }
  .stat b { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat.is-leave b { color: var(--leave); }
  .stat.is-attend b { color: var(--accent); }
  .detail { margin-top: 12px; display: none; }
  .detail.open { display: block; }
  .detail h3 { font-size: 14px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 5px 12px; font-size: 14px; border: 1px solid var(--border); background: var(--surface-2);
  }
  .chip.attend { background: var(--ok-bg); border-color: transparent; }
  .chip.leave { background: var(--leave-bg); border-color: transparent; }
  .chip:has(.x) { padding-right: 2px; }
  .chip .x {
    border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1;
    width: 30px; height: 30px; margin: -6px 0; border-radius: 50%; display: grid; place-items: center; padding: 0;
  }
  .chip .x:hover, .chip .x:active { background: rgba(0, 0, 0, 0.08); color: var(--text); }
  .tag { font-size: 12px; color: var(--muted); }

  /* 功能三：可約的人 */
  .people { list-style: none; margin: 12px 0 0; padding: 0; }
  .people li {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .people li:first-child { border-top: 0; }
  .name-btn { border: 0; background: none; color: var(--text); font-weight: 600; padding: 0; text-align: left; }
  .name-btn:hover { text-decoration: underline; }
  .status { font-size: 12px; border-radius: 999px; padding: 2px 8px; margin-left: 6px; font-weight: 600; }
  .status.yes { background: var(--ok-bg); color: var(--accent); }
  .status.no { background: var(--danger-bg); color: var(--danger); }
  .rejected .name-btn { color: var(--muted); text-decoration: line-through; }

  /* 對話框 */
  dialog {
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
    padding: 20px; width: min(360px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }

  /* 行事曆 */
  .icon-btn {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--accent); display: grid; place-items: center; padding: 0;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  #calDialog { width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); padding-top: 0; }
  .cal-head {
    position: sticky; top: 0; z-index: 1; background: var(--surface);
    padding: 14px 0 10px; border-bottom: 1px solid var(--border);
  }
  .close-x {
    position: absolute; top: 10px; right: -8px; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: none; color: var(--muted); font-size: 24px; line-height: 1;
  }
  .month { margin-top: 16px; }
  .month h3 { font-size: 14px; margin: 0 0 6px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal .wd { font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0; }
  .day {
    border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text);
    min-height: 44px; padding: 3px 0; display: flex; flex-direction: column; align-items: center;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .day.play { background: var(--ok-bg); }
  .day.today { border-color: var(--border); }
  .day.selected { border-color: var(--accent); }
  .day .n { font-weight: 700; color: var(--accent); font-size: 13px; }
  .day .l { font-size: 10px; color: var(--leave); }
  .day.off { background: var(--danger-bg); }
  .day.off .n { color: var(--danger); }
  .day.out { opacity: 0.3; }
  .off-banner {
    display: none; margin-top: 12px; padding: 14px; border-radius: 12px; text-align: center;
    background: var(--danger-bg); color: var(--danger); font-weight: 700;
  }
  .is-off .off-banner { display: block; }
  .is-off .stats, .is-off .detail, .is-off .hint, .is-off #leaveBtn { display: none !important; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .list li:first-child { border-top: 0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .form-grid input { width: 100%; }
  .form-grid .full { grid-column: 1 / -1; }
  .settings-h { font-size: 14px; margin: 18px 0 0; }
  dialog h2 { margin-bottom: 12px; }
  dialog label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  dialog select, dialog input { width: 100%; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  details summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row between" style="flex-wrap:nowrap">
    <div>
      <h1>🏸 羽球點名板</h1>
      <p class="muted" style="margin:0">誰請假、誰出席、還能約誰，一頁看完。</p>
    </div>
    <button class="icon-btn" id="calBtn" aria-label="開啟本季行事曆" title="本季行事曆">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
        <circle cx="8" cy="14" r="0.6" fill="currentColor"/><circle cx="12" cy="14" r="0.6" fill="currentColor"/><circle cx="16" cy="14" r="0.6" fill="currentColor"/>
        <circle cx="8" cy="17.5" r="0.6" fill="currentColor"/><circle cx="12" cy="17.5" r="0.6" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!-- 日期 -->
  <div class="card row between">
    <label class="row" for="playDate"><strong>打球日</strong></label>
    <span class="row" style="gap:8px">
      <span class="muted" id="weekdayLabel"></span>
      <input type="date" id="playDate">
    </span>
    <div class="row between" style="width:100%">
      <span class="muted" id="seasonLabel"></span>
      <button class="btn small" id="offToggle"></button>
    </div>
  </div>

  <!-- 功能一 + 功能二 -->
  <div class="card" id="statusCard">
    <div class="row between">
      <h2>出席狀況</h2>
      <button class="btn leave" id="leaveBtn">我要請假</button>
    </div>
    <div class="stats" style="margin-top:12px">
      <button class="stat is-attend" data-toggle="detail">出席<b id="attendCount">0</b></button>
      <button class="stat is-leave" data-toggle="detail">請假<b id="leaveCount">0</b></button>
    </div>
    <div class="detail" id="detail">
      <h3>出席</h3>
      <div class="chips" id="attendList"></div>
      <h3>請假</h3>
      <div class="chips" id="leaveList"></div>
    </div>
    <div class="off-banner">這天全員請假，不打球 🏖️</div>
    <p class="muted hint" style="margin:10px 0 0">點上面的數字可以看名單</p>
  </div>

  <!-- 功能三 + 功能四 -->
  <div class="card">
    <div class="row between">
      <h2>可以約的人</h2>
      <span class="muted">點名字詢問是否候補</span>
    </div>
    <ul class="people" id="people"></ul>
    <div class="row" id="addPersonForm" style="margin-top:12px">
      <input type="text" id="newPerson" placeholder="新增可約的人" style="flex:1">
      <button class="btn small" type="button" data-submit>新增</button>
    </div>
  </div>

  <!-- 固定成員設定 -->
  <div class="card">
    <details>
      <summary>固定成員（預設都出席）</summary>
      <div class="chips" id="memberList" style="margin-top:12px"></div>
      <div class="row" id="addMemberForm" style="margin-top:12px">
        <input type="text" id="newMember" placeholder="新增成員" style="flex:1">
        <button class="btn small" type="button" data-submit>新增</button>
      </div>
    </details>
  </div>

  <!-- 季度與全員請假設定 -->
  <div class="card">
    <details id="settings">
      <summary>季度與全員請假日</summary>
      <h3 class="settings-h">季度</h3>
      <p class="muted" style="margin:2px 0 0">自訂每一季的起訖日期，季內每週三自動排為打球日。</p>
      <ul class="list" id="seasonList"></ul>
      <div class="form-grid" id="addSeasonForm">
        <input type="text" id="seasonName" class="full" placeholder="季名稱，例如：2026 秋季" required>
        <label class="muted" style="font-size:13px">開始<input type="date" id="seasonStart" required></label>
        <label class="muted" style="font-size:13px">結束<input type="date" id="seasonEnd" required></label>
        <button class="btn small full" type="button" data-submit>新增季度</button>
      </div>
      <h3 class="settings-h">全員請假日</h3>
      <p class="muted" style="margin:2px 0 0">例如國定假日、場地不開，這天不打球。</p>
      <ul class="list" id="offList"></ul>
      <div class="row" id="addOffForm" style="margin-top:12px">
        <input type="date" id="offDate" required style="flex:1">
        <button class="btn small" type="button" data-submit>新增</button>
      </div>
    </details>
  </div>
</div>

<!-- 請假對話框 -->
<dialog id="leaveDialog">
  <div id="leaveForm">
    <h2>請假</h2>
    <label for="leaveName">誰要請假</label>
    <select id="leaveName" required></select>
    <label for="leaveDate">日期</label>
    <input type="date" id="leaveDate" required>
    <div class="actions">
      <button class="btn ghost" type="button" id="leaveCancel">取消</button>
      <button class="btn leave" type="button" id="leaveOk">確定請假</button>
    </div>
  </div>
</dialog>

<!-- 候補對話框 -->
<dialog id="inviteDialog">
  <h2 id="inviteTitle"></h2>
  <p class="muted" style="margin:0">選「是」會加入出席名單，選「否」會標記已拒絕。</p>
  <div class="actions">
    <button class="btn ghost" id="inviteCancel">取消</button>
    <button class="btn" id="inviteNo">否</button>
    <button class="btn primary" id="inviteYes">是</button>
  </div>
</dialog>

<!-- 確認對話框（不用瀏覽器的 confirm，因為內嵌頁面常會被擋掉） -->
<dialog id="confirmDialog">
  <h2 id="confirmText"></h2>
  <div class="actions">
    <button class="btn ghost" id="confirmNo">取消</button>
    <button class="btn leave" id="confirmYes">確定刪除</button>
  </div>
</dialog>

<!-- 本季行事曆 -->
<dialog id="calDialog">
  <div class="cal-head">
    <button class="close-x" id="calX" aria-label="關閉行事曆">✕</button>
    <div class="row" style="justify-content:center; gap:12px; padding-right:28px">
      <button class="btn small ghost" id="calPrev" aria-label="上一季">‹</button>
      <h2 id="calTitle" style="margin:0"></h2>
      <button class="btn small ghost" id="calNext" aria-label="下一季">›</button>
    </div>
    <p class="muted" id="calRange" style="margin:6px 0 0; text-align:center"></p>
  </div>
  <p class="muted" style="margin:8px 0 0">綠色是打球日（數字是出席人數），紅色是全員請假；點日期可切換到那天。</p>
  <div id="calBody"></div>
  <div class="actions"><button class="btn" id="calClose">關閉</button></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var STORAGE_KEY = 'badminton-board-v1';
  var WEEKLY_DAY = 3; // 固定每週三打球（0=日 … 6=六）
  var WEEKDAYS = '日一二三四五六';
  var $ = function (id) { return document.getElementById(id); };

  function today() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  // 資料結構：
  // members: 固定成員（預設出席）
  // pool: 可以約的人
  // leaves: { "2026-09-24": ["小明"] }
  // invites: { "2026-09-24": { "阿華": "yes" | "no" } }
  var state = load() || {
    members: ['小明', '小美', '阿傑', '佳佳'],
    pool: ['阿華', '小王', 'Kevin'],
    leaves: {},
    invites: {},
    playDays: [],
    seasons: [],   // [{ name, start, end }]
    offDays: []    // 全員請假日
  };
  if (!state.playDays) state.playDays = [];
  if (!state.seasons) state.seasons = [];
  if (!state.offDays) state.offDays = [];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
  function sortedSeasons() {
    return state.seasons.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
  }
  function seasonOf(d) {
    for (var i = 0; i < state.seasons.length; i++) {
      var x = state.seasons[i];
      if (d >= x.start && d <= x.end) return x;
    }
    return null;
  }
  function inSeason(d) { return !state.seasons.length || !!seasonOf(d); }
  function isOff(d) { return state.offDays.indexOf(d) !== -1; }

  function weekdayOf(d) { var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
  // 下一個固定球日（今天剛好是就用今天）
  function nextPlayDay() {
    var d = new Date();
    d.setDate(d.getDate() + (WEEKLY_DAY - d.getDay() + 7) % 7);
    var first = fmt(d);
    // 跳過全員請假日與季外日期
    for (var i = 0; i < 60; i++) {
      var k = fmt(d);
      if (inSeason(k) && !isOff(k)) return k;
      d.setDate(d.getDate() + 7);
    }
    return first;
  }
  var date = nextPlayDay();

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 忽略 */ }
  }

  function leavesOn(d) { return state.leaves[d] || []; }
  function invitesOn(d) { return state.invites[d] || {}; }

  function chip(text, cls, onRemove, tag) {
    var el = document.createElement('span');
    el.className = 'chip ' + (cls || '');
    el.textContent = text;
    if (tag) {
      var t = document.createElement('span');
      t.className = 'tag';
      t.textContent = tag;
      el.appendChild(t);
    }
    if (onRemove) {
      var x = document.createElement('button');
      x.className = 'x';
      x.type = 'button';
      x.setAttribute('aria-label', '移除 ' + text);
      x.textContent = '×';
      x.onclick = onRemove;
      el.appendChild(x);
    }
    return el;
  }

  function render() {
    var off = isOff(date);
    $('statusCard').classList.toggle('is-off', off);
    $('offToggle').textContent = off ? '取消全員請假' : '設為全員請假';
    var ss = seasonOf(date);
    $('seasonLabel').textContent = ss ? ss.name : (state.seasons.length ? '不在任何季度內' : '');
    renderSettings();

    var leaves = leavesOn(date);
    var invites = invitesOn(date);
    var attend = state.members.filter(function (m) { return leaves.indexOf(m) === -1; });
    var extras = Object.keys(invites).filter(function (n) { return invites[n] === 'yes'; });

    // 功能一
    $('attendCount').textContent = attend.length + extras.length;
    $('leaveCount').textContent = leaves.length;

    var al = $('attendList'); al.innerHTML = '';
    attend.forEach(function (n) {
      al.appendChild(chip(n, 'attend', function () {
        var list = state.leaves[date] = leavesOn(date);
        if (list.indexOf(n) === -1) list.push(n);
        save(); render();
        toast(n + ' 改為請假');
      }));
    });
    extras.forEach(function (n) {
      al.appendChild(chip(n, 'attend', function () {
        delete invites[n]; save(); render();
        toast(n + ' 已從出席移除');
      }, '候補'));
    });
    if (!al.children.length) al.innerHTML = '<span class="muted">沒有人</span>';

    var ll = $('leaveList'); ll.innerHTML = '';
    leaves.forEach(function (n) {
      ll.appendChild(chip(n, 'leave', function () {
        state.leaves[date] = leaves.filter(function (x) { return x !== n; });
        save(); render();
      }));
    });
    if (!ll.children.length) ll.innerHTML = '<span class="muted">沒有人請假</span>';

    // 功能三 + 四
    var ul = $('people'); ul.innerHTML = '';
    state.pool.forEach(function (n) {
      var li = document.createElement('li');
      if (invites[n] === 'no') li.className = 'rejected';

      var left = document.createElement('div');
      var nameBtn = document.createElement('button');
      nameBtn.className = 'name-btn';
      nameBtn.textContent = n;
      nameBtn.onclick = function () { openInvite(n); };
      left.appendChild(nameBtn);
      if (invites[n]) {
        var s = document.createElement('span');
        s.className = 'status ' + invites[n];
        s.textContent = invites[n] === 'yes' ? '已加入' : '已拒絕';
        left.appendChild(s);
      }

      var right = document.createElement('div');
      right.className = 'row';
      var copy = document.createElement('button');
      copy.className = 'btn small';
      copy.textContent = '複製邀請';
      copy.onclick = function () { copyText(n + '加打球嗎？'); };
      var del = document.createElement('button');
      del.className = 'btn small ghost';
      del.setAttribute('aria-label', '刪除 ' + n);
      del.textContent = '×';
      del.onclick = function () {
        askConfirm('要從名單移除「' + n + '」嗎？', function () {
          state.pool = state.pool.filter(function (x) { return x !== n; });
          save(); render();
        });
      };
      right.appendChild(copy);
      right.appendChild(del);

      li.appendChild(left);
      li.appendChild(right);
      ul.appendChild(li);
    });
    if (!state.pool.length) ul.innerHTML = '<li class="muted">還沒有人，下面新增吧</li>';

    // 固定成員
    var ml = $('memberList'); ml.innerHTML = '';
    state.members.forEach(function (n) {
      ml.appendChild(chip(n, '', function () {
        askConfirm('要移除成員「' + n + '」嗎？', function () {
          state.members = state.members.filter(function (x) { return x !== n; });
          save(); render();
        });
      }));
    });
  }

  function renderSettings() {
    var sl = $('seasonList'); sl.innerHTML = '';
    sortedSeasons().forEach(function (x) {
      var li = document.createElement('li');
      li.innerHTML = '<span><strong></strong><br><span class="muted"></span></span>';
      li.querySelector('strong').textContent = x.name;
      li.querySelector('.muted').textContent = x.start + ' ～ ' + x.end;
      var del = document.createElement('button');
      del.className = 'btn small ghost'; del.textContent = '×';
      del.setAttribute('aria-label', '刪除 ' + x.name);
      del.onclick = function () {
        askConfirm('要刪除「' + x.name + '」嗎？', function () {
          state.seasons = state.seasons.filter(function (y) { return y !== x; });
          save(); render();
        });
      };
      li.appendChild(del); sl.appendChild(li);
    });
    if (!state.seasons.length) sl.innerHTML = '<li class="muted">還沒設定，行事曆會先用一般季度（1–3 月…）</li>';

    var ol = $('offList'); ol.innerHTML = '';
    state.offDays.slice().sort().forEach(function (d) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.textContent = d + '（週' + WEEKDAYS[weekdayOf(d)] + '）';
      var del = document.createElement('button');
      del.className = 'btn small ghost'; del.textContent = '×';
      del.setAttribute('aria-label', '取消 ' + d + ' 全員請假');
      del.onclick = function () { toggleOff(d); };
      li.appendChild(t); li.appendChild(del); ol.appendChild(li);
    });
    if (!state.offDays.length) ol.innerHTML = '<li class="muted">目前沒有</li>';
  }

  function toggleOff(d) {
    if (isOff(d)) state.offDays = state.offDays.filter(function (x) { return x !== d; });
    else state.offDays.push(d);
    save(); render();
  }
  $('offToggle').onclick = function () {
    toggleOff(date);
    toast(isOff(date) ? date + ' 設為全員請假' : date + ' 恢復打球');
  };
  // 不用 <form> 送出（內嵌頁面常會擋掉），改成按鈕點擊或按 Enter
  function onSubmit(id, fn) {
    var box = $(id);
    box.querySelector('[data-submit]').onclick = fn;
    box.querySelectorAll('input').forEach(function (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); fn(); } });
    });
  }
  onSubmit('addOffForm', function () {
    var d = $('offDate').value;
    if (!d) { toast('請先選日期'); return; }
    if (!isOff(d)) toggleOff(d);
    $('offDate').value = '';
    toast(d + ' 設為全員請假');
  });
  onSubmit('addSeasonForm', function () {
    var n = $('seasonName').value.trim(), a = $('seasonStart').value, b = $('seasonEnd').value;
    if (!n || !a || !b) { toast('請填季名稱、開始和結束日期'); return; }
    if (a > b) { toast('結束日期要在開始日期之後'); return; }
    state.seasons.push({ name: n, start: a, end: b });
    save(); render();
    $('seasonName').value = $('seasonStart').value = $('seasonEnd').value = '';
    toast('已新增 ' + n);
  });

  // 日期
  $('playDate').value = date;
  $('playDate').onchange = function () { setDate(this.value || today()); };
  function setDate(d) {
    date = d;
    $('playDate').value = d;
    $('weekdayLabel').textContent = '週' + WEEKDAYS[weekdayOf(d)];
    if (weekdayOf(d) !== WEEKLY_DAY && state.playDays.indexOf(d) === -1) { state.playDays.push(d); save(); }
    render();
  }

  function attendCount(d) {
    var leaves = leavesOn(d), inv = invitesOn(d);
    return state.members.filter(function (m) { return leaves.indexOf(m) === -1; }).length +
      Object.keys(inv).filter(function (n) { return inv[n] === 'yes'; }).length;
  }
  function isPlayDay(d) {
    if (isOff(d)) return false;
    return (weekdayOf(d) === WEEKLY_DAY && inSeason(d)) || state.playDays.indexOf(d) !== -1 || leavesOn(d).length > 0 || Object.keys(invitesOn(d)).length > 0;
  }

  // 行事曆：有自訂季度就依季度顯示，否則用一般季度（三個月）
  var calIdx, calYear, calQ;
  function calRange() {
    var list = sortedSeasons();
    if (list.length) {
      var x = list[calIdx];
      return { title: x.name, start: x.start, end: x.end, hasPrev: calIdx > 0, hasNext: calIdx < list.length - 1 };
    }
    return {
      title: calYear + ' 年 第 ' + (calQ + 1) + ' 季',
      start: fmt(new Date(calYear, calQ * 3, 1)),
      end: fmt(new Date(calYear, calQ * 3 + 3, 0)),
      hasPrev: true, hasNext: true
    };
  }
  function renderCal() {
    var r = calRange();
    $('calTitle').textContent = r.title;
    $('calPrev').disabled = !r.hasPrev;
    $('calNext').disabled = !r.hasNext;
    var body = $('calBody'); body.innerHTML = '';
    var t = today(), totalPlay = 0, totalOff = 0;
    var sp = r.start.split('-'), ep = r.end.split('-');
    var y = +sp[0], m = +sp[1] - 1, lastY = +ep[0], lastM = +ep[1] - 1;
    while (y < lastY || (y === lastY && m <= lastM)) {
      var box = document.createElement('div'); box.className = 'month';
      var h = document.createElement('h3'); h.textContent = (y !== +sp[0] || y !== lastY ? y + ' 年 ' : '') + (m + 1) + ' 月';
      var played = 0;
      var grid = document.createElement('div'); grid.className = 'cal';
      WEEKDAYS.split('').forEach(function (w) {
        var c = document.createElement('div'); c.className = 'wd'; c.textContent = w; grid.appendChild(c);
      });
      var first = new Date(y, m, 1).getDay();
      var days = new Date(y, m + 1, 0).getDate();
      for (var i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
      for (var d = 1; d <= days; d++) {
        var key = y + '-' + pad(m + 1) + '-' + pad(d);
        var b = document.createElement('button');
        b.className = 'day' + (key === t ? ' today' : '') + (key === date ? ' selected' : '');
        b.innerHTML = '<span>' + d + '</span>';
        var label = (m + 1) + '月' + d + '日';
        if (key < r.start || key > r.end) {
          b.classList.add('out');
        } else if (isOff(key)) {
          totalOff++;
          b.classList.add('off');
          b.innerHTML += '<span class="n">停</span>';
          label += '，全員請假';
        } else if (isPlayDay(key)) {
          played++;
          b.classList.add('play');
          var n = attendCount(key), l = leavesOn(key).length;
          b.innerHTML += '<span class="n">' + n + '人</span>' + (l ? '<span class="l">假' + l + '</span>' : '');
          label += '，出席 ' + n + ' 人' + (l ? '，請假 ' + l + ' 人' : '');
        }
        b.setAttribute('aria-label', label);
        b.onclick = (function (k) { return function () { $('calDialog').close(); setDate(k); }; })(key);
        grid.appendChild(b);
      }
      totalPlay += played;
      if (played) h.textContent += '・打球 ' + played + ' 次';
      box.appendChild(h); box.appendChild(grid); body.appendChild(box);
      if (++m > 11) { m = 0; y++; }
    }
    $('calRange').textContent = r.start + ' ～ ' + r.end + '｜打球 ' + totalPlay + ' 次' + (totalOff ? '・全員請假 ' + totalOff + ' 天' : '');
  }
  function shiftQ(step) {
    if (state.seasons.length) {
      calIdx = Math.max(0, Math.min(state.seasons.length - 1, calIdx + step));
    } else {
      calQ += step;
      if (calQ < 0) { calQ = 3; calYear--; }
      if (calQ > 3) { calQ = 0; calYear++; }
    }
    renderCal();
  }
  $('calBtn').onclick = function () {
    var list = sortedSeasons();
    if (list.length) {
      // 找包含目前日期的季；沒有就找下一個季；再沒有就用最後一季
      calIdx = list.length - 1;
      for (var i = 0; i < list.length; i++) {
        if (date <= list[i].end) { calIdx = i; break; }
      }
    } else {
      var p = date.split('-');
      calYear = +p[0]; calQ = Math.floor((+p[1] - 1) / 3);
    }
    renderCal();
    $('calDialog').showModal();
    var sel = $('calBody').querySelector('.day.selected');
    if (sel) sel.closest('.month').scrollIntoView({ block: 'center' });
  };
  $('calPrev').onclick = function () { shiftQ(-1); };
  $('calNext').onclick = function () { shiftQ(1); };
  $('calClose').onclick = $('calX').onclick = function () { $('calDialog').close(); };
  // 點行事曆外面的灰色區域也能關閉（所有對話框通用）
  document.querySelectorAll('dialog').forEach(function (dlg) {
    dlg.addEventListener('click', function (e) {
      if (e.target !== dlg) return;
      var r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
    });
  });

  var onConfirm = null;
  function askConfirm(msg, cb) {
    onConfirm = cb;
    $('confirmText').textContent = msg;
    $('confirmDialog').showModal();
  }
  $('confirmYes').onclick = function () {
    $('confirmDialog').close();
    if (onConfirm) onConfirm();
    onConfirm = null;
  };
  $('confirmNo').onclick = function () { onConfirm = null; $('confirmDialog').close(); };

  // 功能一：點數字展開名單
  document.querySelectorAll('[data-toggle="detail"]').forEach(function (b) {
    b.onclick = function () { $('detail').classList.toggle('open'); };
  });

  // 功能二：請假
  $('leaveBtn').onclick = function () {
    var sel = $('leaveName'); sel.innerHTML = '';
    state.members.forEach(function (n) {
      var o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o);
    });
    $('leaveDate').value = date;
    $('leaveDialog').showModal();
  };
  $('leaveCancel').onclick = function () { $('leaveDialog').close(); };
  $('leaveOk').onclick = function () {
    var n = $('leaveName').value, d = $('leaveDate').value;
    if (!n || !d) { toast('請選人和日期'); return; }
    $('leaveDialog').close();
    var list = state.leaves[d] = leavesOn(d);
    if (list.indexOf(n) === -1) list.push(n);
    save(); render();
    toast(n + ' 已請假（' + d + '）');
  };

  // 功能三：候補與否
  var inviting = null;
  function openInvite(n) {
    inviting = n;
    $('inviteTitle').textContent = n + ' 要候補嗎？';
    $('inviteDialog').showModal();
  }
  function answer(v) {
    var inv = state.invites[date] = invitesOn(date);
    inv[inviting] = v;
    save(); render();
    $('inviteDialog').close();
  }
  $('inviteYes').onclick = function () { answer('yes'); };
  $('inviteNo').onclick = function () { answer('no'); };
  $('inviteCancel').onclick = function () { $('inviteDialog').close(); };

  // 功能四：複製到剪貼簿
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) { /* 忽略 */ }
      document.body.removeChild(ta);
      toast('已複製：' + text);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast('已複製：' + text); }, fallback);
    } else {
      fallback();
    }
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // 新增名字
  function addName(inputId, listKey) {
    return function () {
      var v = $(inputId).value.trim();
      if (v && state[listKey].indexOf(v) === -1) { state[listKey].push(v); save(); render(); }
      $(inputId).value = '';
    };
  }
  onSubmit('addPersonForm', addName('newPerson', 'pool'));
  onSubmit('addMemberForm', addName('newMember', 'members'));

  setDate(date);
})();
</script>
</body>
</html>
