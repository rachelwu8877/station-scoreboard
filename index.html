<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闖關計分板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #eff2ef;
    --surface: #ffffff;
    --surface-2: #e3e9e5;
    --text: #1a2420;
    --text-muted: #5d6b64;
    --border: #d6deda;
    --accent: #2e7d64;
    --accent-contrast: #ffffff;
    --gold: #c9972e;
    --silver: #8b95a1;
    --bronze: #b0713c;
    --danger: #b94a36;
    --danger-bg: #f7e6e2;
    --game-darts: #7b5ea7;
    --game-boxing: #b94a36;
    --game-basketball: #c9972e;
    --game-baseball: #3b6ea0;
    --led-bg: #101915;
    --led-text: #6ee7b0;
    --led-text-gold: #ffcf7a;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 14px rgba(20, 30, 25, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101512;
      --surface: #17201c;
      --surface-2: #1e2a24;
      --text: #e9f0ec;
      --text-muted: #93a69c;
      --border: #2a3830;
      --accent: #4fc69d;
      --accent-contrast: #0b1512;
      --gold: #e0b24e;
      --silver: #a9b3bc;
      --bronze: #c98957;
      --danger: #e1786a;
      --danger-bg: #3a211d;
      --game-darts: #a98fd1;
      --game-boxing: #e1786a;
      --game-basketball: #e0b24e;
      --game-baseball: #6fa0d8;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #101512;
    --surface: #17201c;
    --surface-2: #1e2a24;
    --text: #e9f0ec;
    --text-muted: #93a69c;
    --border: #2a3830;
    --accent: #4fc69d;
    --accent-contrast: #0b1512;
    --gold: #e0b24e;
    --silver: #a9b3bc;
    --bronze: #c98957;
    --danger: #e1786a;
    --danger-bg: #3a211d;
    --game-darts: #a98fd1;
    --game-boxing: #e1786a;
    --game-basketball: #e0b24e;
    --game-baseball: #6fa0d8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 28px 20px 64px;
    min-height: 100vh;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  header.page {
    margin-bottom: 24px;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(24px, 4vw, 32px);
    text-wrap: balance;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14.5px;
    margin: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  section.block { margin-bottom: 34px; }

  .block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }

  /* Leaderboard */
  #leaderboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .rank-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: transform 0.2s ease;
  }
  .rank-card.rank-1 { border-color: var(--gold); }

  .rank-top-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rank-badge {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .rank-badge.medal-1 { background: var(--gold); color: #3a2a05; border-color: var(--gold); }
  .rank-badge.medal-2 { background: var(--silver); color: #23292d; border-color: var(--silver); }
  .rank-badge.medal-3 { background: var(--bronze); color: #33200f; border-color: var(--bronze); }

  .rank-name {
    font-weight: 700;
    font-size: 15.5px;
    overflow-wrap: anywhere;
  }

  .game-rank-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .game-rank-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .game-rank-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .game-rank-chip.chip-first { color: var(--text); font-weight: 700; }

  /* Game panels */
  #games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
    gap: 16px;
  }

  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .game-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 14px 16px;
    margin: 0;
    border: none;
    border-bottom: 1px solid var(--border);
    border-left: 4px solid var(--gc, var(--accent));
    background: var(--surface);
    color: var(--text);
    text-align: left;
    font-size: inherit;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  .game-card.is-open .game-head { border-bottom-color: var(--border); }
  .game-card:not(.is-open) .game-head { border-bottom: none; }
  .game-head:hover { background: var(--surface-2); }

  .game-icon { font-size: 20px; line-height: 1; }
  .game-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 16.5px;
  }
  .game-played {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .game-chevron {
    font-size: 12px;
    color: var(--text-muted);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  .game-card.is-open .game-chevron { transform: rotate(180deg); }

  .player-row {
    display: grid;
    grid-template-columns: 76px 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .player-row:last-child { border-bottom: none; }

  .row-result {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .row-rank-badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 11px;
    flex-shrink: 0;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .row-rank-badge.medal-1 { background: var(--gold); color: #3a2a05; border-color: var(--gold); }
  .row-rank-badge.medal-2 { background: var(--silver); color: #23292d; border-color: var(--silver); }
  .row-rank-badge.medal-3 { background: var(--bronze); color: #33200f; border-color: var(--bronze); }

  .player-name {
    font-weight: 700;
    font-size: 13.5px;
    overflow-wrap: anywhere;
  }

  .rounds {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    min-height: 26px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 4px 3px 9px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .chip button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip button:hover { background: var(--danger-bg); color: var(--danger); }

  .add-form {
    display: flex;
    gap: 4px;
  }
  .add-form input {
    width: 58px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 7px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .add-form button {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: 7px;
    width: 28px;
    font-weight: 700;
    font-size: 15px;
  }
  .add-form button:hover { filter: brightness(1.08); }

  .add-form input.input-error {
    border-color: var(--danger);
    animation: shake 0.3s;
  }
  @media (prefers-reduced-motion: reduce) {
    .add-form input.input-error { animation: none; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .subtotal {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    background: var(--led-bg);
    color: var(--led-text);
    border-radius: 7px;
    padding: 4px 9px;
    min-width: 44px;
    text-align: center;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 30px;
  }
  .reset-link {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 4px;
  }
  .reset-link:hover { color: var(--danger); }

  /* confirm modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 12, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    max-width: 340px;
    width: 100%;
    box-shadow: var(--shadow);
  }
  .modal h3 {
    font-family: "Fraunces", Georgia, serif;
    margin: 0 0 8px;
    font-size: 17px;
  }
  .modal p { margin: 0 0 18px; font-size: 13.5px; color: var(--text-muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-actions button {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .modal-actions button.confirm {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    body { padding: 18px 12px 48px; }

    /* One compact row per player so all 5 fit on screen without scrolling */
    #leaderboard {
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .rank-card {
      flex-direction: row;
      align-items: center;
      padding: 8px 10px;
      gap: 8px;
    }
    .rank-top-row { flex-shrink: 0; gap: 8px; }
    .rank-badge { width: 24px; height: 24px; font-size: 11px; }
    .rank-name { font-size: 13.5px; white-space: nowrap; }
    .game-rank-chips {
      flex-wrap: nowrap;
      gap: 4px;
      margin-left: auto;
      overflow-x: auto;
    }
    .game-rank-chip { padding: 3px 6px; font-size: 11px; }

    .player-row {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "name result"
        "rounds rounds"
        "form form";
      row-gap: 8px;
      padding: 12px 14px;
    }
    .player-name { grid-area: name; font-size: 14.5px; }
    .row-result { grid-area: result; }
    .subtotal { font-size: 16px; padding: 6px 11px; }
    .rounds { grid-area: rounds; min-height: 30px; }
    .add-form { grid-area: form; width: 100%; }

    .chip {
      padding: 5px 5px 5px 11px;
      font-size: 13px;
    }
    .chip button { width: 22px; height: 22px; font-size: 15px; }

    .add-form input {
      flex: 1;
      width: auto;
      font-size: 16px; /* prevents iOS auto-zoom on focus */
      padding: 9px 10px;
    }
    .add-form button {
      width: 40px;
      font-size: 18px;
    }
  }

  @media (max-width: 420px) {
    #leaderboard { grid-template-columns: 1fr; }
  }
</style>

</head>
<body>

<div class="wrap">
  <header class="page">
    <h1>闖關計分板</h1>
  </header>

  <section class="block">
    <div class="block-head">
      <h2>即時排名</h2>
    </div>
    <div id="leaderboard"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>遊戲關卡</h2>
      <span class="subtitle" id="updatedAt"></span>
    </div>
    <div id="games"></div>
  </section>

  <footer>
    每項關卡分數可累加多輪；點分數旁的 × 可移除該輪紀錄。
    <button class="reset-link" id="resetBtn" type="button">重設全部分數</button>
  </footer>
</div>

<div class="modal-overlay" id="confirmOverlay" hidden>
  <div class="modal">
    <h3>重設全部分數？</h3>
    <p>將清除 5 位玩家在 4 個關卡的所有已輸入分數，此動作無法復原。</p>
    <div class="modal-actions">
      <button type="button" id="cancelReset">取消</button>
      <button type="button" class="confirm" id="confirmReset">確定重設</button>
    </div>
  </div>
</div>

<script>
(function () {
  var GAMES = [
    { key: 'darts', name: '射飛鏢', icon: '🎯', color: 'var(--game-darts)' },
    { key: 'boxing', name: '拳擊機', icon: '🥊', color: 'var(--game-boxing)' },
    { key: 'basketball', name: '投籃球', icon: '🏀', color: 'var(--game-basketball)' },
    { key: 'baseball', name: '打棒球', icon: '⚾', color: 'var(--game-baseball)' }
  ];
  var PLAYERS = ['玫欣', '瑞秋', '帥帥', '蓋瑞', '佳芸'];
  var STORAGE_KEY = 'stationScoreboard_v1';
  var expanded = {};
  GAMES.forEach(function (g) { expanded[g.key] = false; });

  function emptyState() {
    var s = {};
    GAMES.forEach(function (g) {
      s[g.key] = {};
      PLAYERS.forEach(function (p) { s[g.key][p] = []; });
    });
    return s;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      var parsed = JSON.parse(raw);
      var s = emptyState();
      GAMES.forEach(function (g) {
        PLAYERS.forEach(function (p) {
          if (parsed[g.key] && Array.isArray(parsed[g.key][p])) {
            s[g.key][p] = parsed[g.key][p].filter(function (n) { return typeof n === 'number' && isFinite(n); });
          }
        });
      });
      return s;
    } catch (e) {
      return emptyState();
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var state = loadState();

  // Accepts full-width digits/period/minus (common with Chinese IMEs) as well as normal ASCII.
  function normalizeNumberInput(str) {
    if (!str) return str;
    str = str.replace(/[０-９]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFF10 + 0x30);
    });
    str = str.replace(/[．]/g, '.');
    str = str.replace(/[－−]/g, '-');
    return str.trim();
  }

  function gameTotal(gameKey, player) {
    return state[gameKey][player].reduce(function (a, b) { return a + b; }, 0);
  }

  // Whether anyone has entered at least one round for this game yet.
  function gamePlayedCount(gameKey) {
    return PLAYERS.reduce(function (n, p) { return n + state[gameKey][p].length; }, 0);
  }

  // Rank every player within one game (highest score = rank 1). Ties share a rank.
  function computeGameRanking(gameKey) {
    var totals = PLAYERS.map(function (p) { return { player: p, score: gameTotal(gameKey, p) }; });
    var ranks = {};
    totals.forEach(function (row) {
      var rank = 1;
      for (var j = 0; j < totals.length; j++) {
        if (totals[j].score > row.score) rank++;
      }
      ranks[row.player] = rank;
    });
    return ranks;
  }

  // Sum each player's per-game placings (only for games that have started); smallest total wins.
  function computeOverallRanking() {
    var gameRanksByGame = {};
    var startedGames = [];
    GAMES.forEach(function (g) {
      gameRanksByGame[g.key] = computeGameRanking(g.key);
      if (gamePlayedCount(g.key) > 0) startedGames.push(g);
    });

    var sums = PLAYERS.map(function (p) {
      var rankSum = startedGames.reduce(function (acc, g) { return acc + gameRanksByGame[g.key][p]; }, 0);
      return { player: p, rankSum: rankSum };
    });

    var ranked = sums.map(function (row) {
      var rank = 1;
      for (var j = 0; j < sums.length; j++) {
        if (sums[j].rankSum < row.rankSum) rank++;
      }
      return { player: row.player, rankSum: row.rankSum, rank: rank };
    });
    ranked.sort(function (a, b) { return a.rankSum - b.rankSum; });

    return { ranked: ranked, gameRanksByGame: gameRanksByGame, startedGames: startedGames };
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') e.className = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else if (k === 'text') e.textContent = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function renderLeaderboard() {
    var board = document.getElementById('leaderboard');
    board.innerHTML = '';
    var result = computeOverallRanking();

    var anyStarted = result.startedGames.length > 0;

    result.ranked.forEach(function (row) {
      var medalClass = (anyStarted && row.rank === 1) ? 'medal-1' : row.rank === 2 ? 'medal-2' : row.rank === 3 ? 'medal-3' : '';
      var card = el('div', { class: 'rank-card' + (anyStarted && row.rank === 1 ? ' rank-1' : '') });

      var top = el('div', { class: 'rank-top-row' }, [
        el('div', { class: 'rank-badge ' + medalClass, text: String(anyStarted ? row.rank : '-') }),
        el('div', { class: 'rank-name', text: row.player })
      ]);
      card.appendChild(top);

      var chips = el('div', { class: 'game-rank-chips' });
      GAMES.forEach(function (g) {
        var started = gamePlayedCount(g.key) > 0;
        var gRank = result.gameRanksByGame[g.key][row.player];
        chips.appendChild(el('span', {
          class: 'game-rank-chip' + (started && gRank === 1 ? ' chip-first' : ''),
          title: g.name + '：' + (started ? '第 ' + gRank + ' 名' : '尚未開始')
        }, [
          el('span', { class: 'dot', style: 'background:' + g.color }),
          document.createTextNode(g.icon + (started ? gRank : '-'))
        ]));
      });
      card.appendChild(chips);

      board.appendChild(card);
    });
  }

  function renderGames() {
    var container = document.getElementById('games');
    container.innerHTML = '';

    GAMES.forEach(function (g) {
      var playedCount = gamePlayedCount(g.key);
      var isOpen = !!expanded[g.key];

      var card = el('div', { class: 'game-card' + (isOpen ? ' is-open' : '') });
      var head = el('button', {
        type: 'button',
        class: 'game-head',
        style: '--gc:' + g.color,
        'aria-expanded': isOpen ? 'true' : 'false'
      }, [
        el('span', { class: 'game-icon', text: g.icon }),
        el('span', { class: 'game-name', text: g.name }),
        el('span', { class: 'game-played', text: '共 ' + playedCount + ' 輪' }),
        el('span', { class: 'game-chevron', 'aria-hidden': 'true', text: '▾' })
      ]);
      head.addEventListener('click', function () {
        expanded[g.key] = !expanded[g.key];
        renderGames();
      });
      card.appendChild(head);

      var body = el('div', { class: 'game-body' });
      if (!isOpen) body.hidden = true;

      var gameRanks = computeGameRanking(g.key);

      PLAYERS.forEach(function (p) {
        var row = el('div', { class: 'player-row' });
        row.appendChild(el('div', { class: 'player-name', text: p }));

        var roundsWrap = el('div', { class: 'rounds' });
        state[g.key][p].forEach(function (score, idx) {
          var chip = el('span', { class: 'chip' }, [
            document.createTextNode(String(score))
          ]);
          var rmBtn = el('button', { type: 'button', 'aria-label': '移除這輪分數', text: '×' });
          rmBtn.addEventListener('click', function () {
            state[g.key][p].splice(idx, 1);
            saveState();
            renderAll();
          });
          chip.appendChild(rmBtn);
          roundsWrap.appendChild(chip);
        });
        row.appendChild(roundsWrap);

        var form = el('form', { class: 'add-form', novalidate: 'novalidate' });
        var input = el('input', {
          type: 'text',
          inputmode: 'decimal',
          pattern: '-?[0-9]*\\.?[0-9]*',
          placeholder: '分數',
          autocomplete: 'off',
          'data-game': g.key,
          'data-player': p,
          'aria-label': p + ' ' + g.name + ' 新增一輪分數'
        });
        var addBtn = el('button', { type: 'submit', 'aria-label': '新增分數', text: '+' });
        form.appendChild(input);
        form.appendChild(addBtn);
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var val = parseFloat(normalizeNumberInput(input.value));
          if (isNaN(val)) {
            input.classList.remove('input-error');
            void input.offsetWidth; // restart animation if triggered twice in a row
            input.classList.add('input-error');
            input.focus();
            return;
          }
          state[g.key][p].push(val);
          saveState();
          renderAll();
          focusInput(g.key, p);
        });
        row.appendChild(form);

        var rowRank = gameRanks[p];
        var rowStarted = playedCount > 0;
        var rowMedal = rowStarted && rowRank === 1 ? 'medal-1' : rowStarted && rowRank === 2 ? 'medal-2' : rowStarted && rowRank === 3 ? 'medal-3' : '';
        row.appendChild(el('div', { class: 'row-result' }, [
          el('div', {
            class: 'row-rank-badge ' + rowMedal,
            title: rowStarted ? '本關第 ' + rowRank + ' 名' : '尚未開始',
            text: rowStarted ? String(rowRank) : '-'
          }),
          el('div', { class: 'subtotal', text: String(gameTotal(g.key, p)) })
        ]));

        body.appendChild(row);
      });

      card.appendChild(body);
      container.appendChild(card);
    });
  }

  function focusInput(gameKey, player) {
    var inputs = document.querySelectorAll('.add-form input[data-game="' + gameKey + '"]');
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].getAttribute('data-player') === player) {
        inputs[i].focus();
        break;
      }
    }
  }

  function renderUpdated() {
    var now = new Date();
    document.getElementById('updatedAt').textContent = '最後更新：' + now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function renderAll() {
    renderLeaderboard();
    renderGames();
    renderUpdated();
  }

  renderAll();

  var overlay = document.getElementById('confirmOverlay');
  document.getElementById('resetBtn').addEventListener('click', function () {
    overlay.hidden = false;
  });
  document.getElementById('cancelReset').addEventListener('click', function () {
    overlay.hidden = true;
  });
  document.getElementById('confirmReset').addEventListener('click', function () {
    state = emptyState();
    saveState();
    renderAll();
    overlay.hidden = true;
  });
  overlay.addEventListener('click', function (ev) {
    if (ev.target === overlay) overlay.hidden = true;
  });
})();
</script>
</body>
</html>
